<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="공구 재고 정리 특가 판매 - 카카오톡 문의">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<title>상품 상세</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">🔧 <span id="site-name">비전툴</span></a>
    <button class="btn-kakao-nav" id="footer-contact-btn-nav">카카오톡 문의</button>
  </div>
</header>

<main class="container">
  <p class="back-link"><a href="index.html">&larr; 목록으로 돌아가기</a></p>
  <section id="product-detail" class="product-detail">
    <p class="empty-state">상품 정보를 불러오는 중입니다...</p>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p id="business-info-line" class="business-info-line"></p>
    <p class="footer-line">카카오톡 ID: <strong id="kakao-id-display"></strong></p>
    <p id="contact-guide" class="footer-line-small"></p>
    <p id="business-hours" class="footer-line-small"></p>
    <button class="btn-primary" id="footer-contact-btn">카카오톡으로 문의하기</button>
  </div>
</footer>

<div id="contact-modal" class="modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">&times;</button>
    <h2>카카오톡으로 문의하기</h2>
    <p class="modal-product">문의 상품: <strong id="modal-product-name"></strong></p>
    <div class="kakao-id-box">
      <span id="modal-kakao-id"></span>
      <button id="copy-kakao-btn" class="btn-copy">ID 복사</button>
    </div>
    <p class="modal-guide" id="modal-guide-text">카카오톡 앱에서 위 ID를 검색해 친구 추가한 뒤, 문의 상품명을 말씀해 주시면 빠르게 답변드립니다.</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/shared.js"></script>
<script src="js/product.js"></script>
</body>
</html>
