<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="공구 재고 정리 특가 판매 - 카카오톡 문의">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
<title>비전툴</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <span class="logo">🔧 <span id="site-name">비전툴</span></span>
    <button class="btn-kakao-nav" id="footer-contact-btn-nav">카카오톡 문의</button>
  </div>
</header>

<section class="hero">
  <div class="container">
    <p class="hero-badge">재고 정리 특가전 진행중</p>
    <h1 id="hero-title">공구 재고 정리 특가</h1>
    <p id="hero-subtitle" class="hero-subtitle"></p>
    <button class="btn-primary" id="hero-contact-btn">카카오톡으로 문의하기</button>
  </div>
</section>

<main class="container">
  <section class="toolbar">
    <nav id="category-tabs" class="category-tabs"></nav>
    <div class="search-row">
      <input type="text" id="search-input" class="search-input" placeholder="상품명 검색">
      <span id="result-count" class="result-count"></span>
    </div>
  </section>

  <section id="product-grid" class="product-grid"></section>
</main>

<footer class="site-footer">
  <div class="container">
    <p id="business-info-line" class="business-info-line"></p>
    <p class="footer-line">카카오톡 ID: <strong id="kakao-id-display"></strong></p>
    <p id="contact-guide" class="footer-line-small"></p>
    <p id="business-hours" class="footer-line-small"></p>
    <button class="btn-primary" id="footer-contact-btn">카카오톡으로 문의하기</button>
  </div>
</footer>

<div id="contact-modal" class="modal">
  <div class="modal-box">
    <button class="modal-close" id="modal-close">&times;</button>
    <h2>카카오톡으로 문의하기</h2>
    <p class="modal-product">문의 상품: <strong id="modal-product-name"></strong></p>
    <div class="kakao-id-box">
      <span id="modal-kakao-id"></span>
      <button id="copy-kakao-btn" class="btn-copy">ID 복사</button>
    </div>
    <p class="modal-guide" id="modal-guide-text">카카오톡 앱에서 위 ID를 검색해 친구 추가한 뒤, 문의 상품명을 말씀해 주시면 빠르게 답변드립니다.</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/products.js"></script>
<script src="js/main.js"></script>
</body>
</html>
